[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "grpo-countdown"
version = "0.1.0"
description = "GRPO (R1-style RL) on the verifiable Countdown task, implemented from scratch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anetisa" }]
dependencies = [
    "torch>=2.1",
]

[project.optional-dependencies]
train = ["transformers>=4.40", "datasets>=2.0"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Anetisa/grpo-countdown"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
